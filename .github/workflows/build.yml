name: Build Release APK

# 触发条件：push 到 release 系列分支（release 或 release/x.y），或在 Actions 页手动触发
on:
  push:
    branches:
      - release
      - "release/**"
  workflow_dispatch:

# 滚动发布需要写仓库（创建/更新 continuous 预发布）
permissions:
  contents: write

# 同一分支的新推送自动取消进行中的旧构建
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # AGP 8.13 官方要求 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 说明：刻意不使用 android-actions/setup-android —— run #1 的失败根因：
      # 该 action 在 runner 上执行 `sdkmanager tools`（包名已从 Google 仓库移除）导致 exit 1。
      # ubuntu runner 镜像本身已预装 sdkmanager 与 ANDROID_HOME，直接调用即可。
      - name: Install Android platform and build tools
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] && [ -n "$ANDROID_HOME" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          "$SDKMGR" --list_installed | grep -E "platforms;|build-tools;" || true

      # 仓库不携带 gradle wrapper（无本地环境），由 setup-gradle 安装精确版本
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Package APK
        run: |
          echo "== 产物目录 =="
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk VolumeTile-release.apk

      # 无论后续滚动发布成败，构建产物都已可下载
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolumeTile-release-${{ github.run_number }}
          path: VolumeTile-release.apk
          if-no-files-found: error

      # 更新滚动预发布 continuous：手机可直接从 Releases 页下载最新 APK
      # （不限分支：无论 release 分支推送还是手动触发，构建成功即更新）
      - name: Update rolling release (continuous)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view continuous > /dev/null 2>&1; then
            gh release create continuous \
              --prerelease \
              --title "Continuous Build" \
              --notes "滚动构建产物：每次构建成功自动更新，仅供手机下载测试。"
          fi
          gh release upload continuous VolumeTile-release.apk --clobber
